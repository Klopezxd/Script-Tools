name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Standalone (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: tools-windows-x64.exe
            built_binary: dist/tools.exe
          - os: ubuntu-latest
            artifact_name: tools-linux-x64
            built_binary: dist/tools
          - os: macos-latest
            artifact_name: tools-macos-universal
            built_binary: dist/tools

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/pdf-optimizer/requirements.txt
          pip install pyinstaller rich pytest

      - name: Build Standalone Binary with PyInstaller
        run: |
          pyinstaller --clean tools.spec

      - name: Rename and Stage Binary
        shell: bash
        run: |
          mkdir -p release_assets
          cp "${{ matrix.built_binary }}" "release_assets/${{ matrix.artifact_name }}"
          chmod +x "release_assets/${{ matrix.artifact_name }}"

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release_assets/${{ matrix.artifact_name }}

  publish-release:
    name: Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts

      - name: Generate Checksums
        run: |
          mkdir -p release_dist
          find release_artifacts -type f -exec cp {} release_dist/ \;
          cd release_dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Release (Rolling Build)' }}
          target_commitish: ${{ github.sha }}
          files: release_dist/*
          generate_release_notes: true
          draft: false
          prerelease: false

