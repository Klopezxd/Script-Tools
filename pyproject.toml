[project]
name = "script-tools"
version = "2.0.0"
description = "Curated, modular automation & developer toolkit for Windows, Linux, and macOS."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Klever Lopez", email = "lkleverjosue@gmail.com" }
]
keywords = ["automation", "video-compression", "pdf-optimization", "sysadmin", "dev-tools"]
dependencies = [
    "pymupdf>=1.23.0",
    "pikepdf>=8.0.0",
    "Pillow>=9.5.0",
    "rich>=13.0.0",
]

[project.scripts]
tools = "tools:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "tools/video-compressor",
    "tools/pdf-optimizer",
    "tools/vscode-path-doctor",
    "."
]
